spring.application.name=pocketledger

# loads .env (ignored by git) so DB password stays off GitHub
# optional: app still starts if file is missing 
spring.config.import=optional:file:.env[.properties]

# Aiven MySQL. Every value comes from .env
# refuses unencrypted connections
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED    
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# hibernate creates and updates tables from entity classes at startup
spring.jpa.hibernate.ddl-auto=update

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}